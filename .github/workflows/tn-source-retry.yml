name: TN sources - bounded retry

on:
  schedule:
    - cron: '15 5 * * 1'
  workflow_dispatch:
    inputs:
      runner:
        description: "Choose the GitHub-hosted runner or an explicitly connected portal-access runner"
        type: choice
        options: [hosted, portal]
        default: hosted
      sample_seed:
        description: "Optional reproducible sample seed (letters, numbers, hyphens, underscores)"
        type: string
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: tn-source-retry
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ${{ (inputs.runner == 'portal' || (github.event_name == 'schedule' && vars.BHOOMI_PORTAL_SCHEDULED == 'true')) && 'bhoomi-portal' || 'ubuntu-latest' }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.12'
      - name: Install collector dependency in a temporary environment
        run: |
          python -m venv "$RUNNER_TEMP/bhoomi-venv"
          "$RUNNER_TEMP/bhoomi-venv/bin/python" -m pip install --quiet requests
          echo "$RUNNER_TEMP/bhoomi-venv/bin" >> "$GITHUB_PATH"
      - name: Check official RERA pages (no project scraping)
        run: |
          echo '## Tamil Nadu RERA source check' >> "$GITHUB_STEP_SUMMARY"
          python -u bhoomi-lens/scripts/tn_rera_health.py --status-file "$RUNNER_TEMP/tn-rera-status.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Retry at most five parked guideline searches
        run: |
          set -o pipefail
          echo '## Tamil Nadu guideline recovery' >> "$GITHUB_STEP_SUMMARY"
          python -u bhoomi-lens/scripts/tn_retry_gaps.py --apply --max-records 5 | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash
      - name: Independently sample historical guideline rows
        env:
          SAMPLE_SEED: ${{ inputs.sample_seed }}
        run: |
          set -o pipefail
          echo '## Historical guideline spot-check' >> "$GITHUB_STEP_SUMMARY"
          set -- --per-revision 2 --status-file "$RUNNER_TEMP/tn-sample-status.json"
          if [ -n "$SAMPLE_SEED" ]; then set -- "$@" --seed "$SAMPLE_SEED"; fi
          python -u bhoomi-lens/scripts/tn_verify_sample.py "$@" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Detect verified changes
        id: changes
        run: |
          git add bhoomi-lens/data/tn_gv/
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No complete new records: no data commit or deployment.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.changed == 'true' && runner.environment == 'github-hosted'
        with:
          node-version: '22'
      - name: Test before committing recovered data
        if: steps.changes.outputs.changed == 'true'
        working-directory: bhoomi-lens
        run: |
          npm ci
          npm test
      - name: Commit only complete recoveries
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'bhoomi-source-retry'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Recover verified TN guideline results'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Report source health after saving checked recoveries
        run: |
          set -o pipefail
          python -u bhoomi-lens/scripts/tn_source_status.py "$RUNNER_TEMP/tn-sample-status.json" "$RUNNER_TEMP/tn-rera-status.json" | tee -a "$GITHUB_STEP_SUMMARY"
