name: NHB housing index highlights

on:
  schedule:
    - cron: '25 4 12 * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'bhoomi-lens/scripts/collect_nhb_hpi_*.py'
      - 'bhoomi-lens/tests/test_nhb_hpi.py'
      - 'bhoomi-lens/data/nhb_hpi_*.js'
      - '.github/workflows/nhb-housing-index.yml'

permissions:
  contents: read

concurrency:
  group: bhoomi-nhb-housing-index
  cancel-in-progress: false

jobs:
  validate-source:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure PDF extraction is available
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y poppler-utils
          fi
      - run: python bhoomi-lens/tests/test_nhb_hpi.py
      - name: Check the official source without writing data
        run: python -u bhoomi-lens/scripts/collect_nhb_hpi_recent.py

  refresh:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure PDF extraction is available
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y poppler-utils
          fi
      - name: Collect and validate the latest official highlights
        run: |
          set -o pipefail
          echo '## NHB RESIDEX source check' >> "$GITHUB_STEP_SUMMARY"
          python -u bhoomi-lens/scripts/collect_nhb_hpi_recent.py --apply | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Detect changed observations
        id: changes
        run: |
          git add bhoomi-lens/data/nhb_hpi_recent.js
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No changed highlights: no commit or deployment.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: '22'
      - name: Test before publishing data
        if: steps.changes.outputs.changed == 'true'
        working-directory: bhoomi-lens
        run: |
          npm ci
          npm test
      - name: Commit and deploy changed data
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'bhoomi-data'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Update NHB housing index highlights'
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run bhoomi-deploy.yml --ref main -R "$GITHUB_REPOSITORY"
