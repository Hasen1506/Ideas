name: PIB project source health

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline parser checks
        run: python bhoomi-lens/tests/test_pib_source_status.py
      - name: Probe three public source pages, without storing data
        run: |
          set -o pipefail
          echo '## PIB project source health' >> "$GITHUB_STEP_SUMMARY"
          python -u bhoomi-lens/scripts/pib_source_status.py | tee -a "$GITHUB_STEP_SUMMARY"
