name: Bhoomi Lens checks

on:
  push:
    paths:
      - 'bhoomi-lens/index.html'
      - 'bhoomi-lens/css/**'
      - 'bhoomi-lens/js/**'
      - 'bhoomi-lens/vendor/**'
      - 'bhoomi-lens/data/*.js'
      - 'bhoomi-lens/scripts/tn_gv_history.py'
      - 'bhoomi-lens/scripts/tn_gv_collect.py'
      - 'bhoomi-lens/scripts/tn_retry_gaps.py'
      - 'bhoomi-lens/scripts/tn_verify_sample.py'
      - 'bhoomi-lens/scripts/tn_rera_health.py'
      - 'bhoomi-lens/scripts/tn_source_status.py'
      - 'bhoomi-lens/scripts/collect_macro.py'
      - 'bhoomi-lens/scripts/collect_tn_district_cpi.py'
      - 'bhoomi-lens/scripts/macro_source_status.py'
      - 'bhoomi-lens/scripts/market_model.py'
      - 'bhoomi-lens/scripts/market_predict.py'
      - 'bhoomi-lens/scripts/landlens_stage.py'
      - 'bhoomi-lens/scripts/audit_market_evidence.js'
      - 'bhoomi-lens/scripts/requirements-market.txt'
      - 'bhoomi-lens/scripts/recheck.py'
      - 'bhoomi-lens/scripts/tn_gv_units.py'
      - 'bhoomi-lens/tests/**'
      - 'bhoomi-lens/package*.json'
      - '.github/workflows/bhoomi-tests.yml'
      - '.github/workflows/tn-source-retry.yml'
      - '.github/workflows/macro-data.yml'
      - '.github/workflows/tn-district-cpi.yml'
      - '.github/workflows/market-model.yml'
  pull_request:
    paths:
      - 'bhoomi-lens/index.html'
      - 'bhoomi-lens/css/**'
      - 'bhoomi-lens/js/**'
      - 'bhoomi-lens/vendor/**'
      - 'bhoomi-lens/data/*.js'
      - 'bhoomi-lens/scripts/tn_gv_history.py'
      - 'bhoomi-lens/scripts/tn_gv_collect.py'
      - 'bhoomi-lens/scripts/tn_retry_gaps.py'
      - 'bhoomi-lens/scripts/tn_verify_sample.py'
      - 'bhoomi-lens/scripts/tn_rera_health.py'
      - 'bhoomi-lens/scripts/tn_source_status.py'
      - 'bhoomi-lens/scripts/collect_macro.py'
      - 'bhoomi-lens/scripts/collect_tn_district_cpi.py'
      - 'bhoomi-lens/scripts/macro_source_status.py'
      - 'bhoomi-lens/scripts/market_model.py'
      - 'bhoomi-lens/scripts/market_predict.py'
      - 'bhoomi-lens/scripts/landlens_stage.py'
      - 'bhoomi-lens/scripts/audit_market_evidence.js'
      - 'bhoomi-lens/scripts/requirements-market.txt'
      - 'bhoomi-lens/scripts/recheck.py'
      - 'bhoomi-lens/scripts/tn_gv_units.py'
      - 'bhoomi-lens/tests/**'
      - 'bhoomi-lens/package*.json'
      - '.github/workflows/bhoomi-tests.yml'
      - '.github/workflows/tn-source-retry.yml'
      - '.github/workflows/macro-data.yml'
      - '.github/workflows/tn-district-cpi.yml'
      - '.github/workflows/market-model.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bhoomi-lens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bhoomi-lens/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:browser
