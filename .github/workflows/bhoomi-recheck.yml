name: Bhoomi Lens weekly re-check
# Free: public repo minutes, public pages and Google News RSS. No API keys.
on:
  schedule:
    - cron: "30 0 * * 1"   # Mondays 06:00 IST
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Re-check projects
        run: python bhoomi-lens/scripts/recheck.py
      - name: Commit updates
        run: |
          git config user.name "bhoomi-recheck"
          git config user.email "actions@users.noreply.github.com"
          git add bhoomi-lens/data/updates.js
          git diff --cached --quiet || git commit -m "Weekly re-check $(date -u +%F)" && git push
